<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none">
    <defs>
        <linearGradient id="stackedGrad" x1="100" y1="40" x2="300" y2="240" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="55%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#43E7D0"/>
        </linearGradient>
        <linearGradient id="cyanAccentStacked" x1="180" y1="90" x2="300" y2="210" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#43E7D0"/>
        </linearGradient>
        <filter id="stackedGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Symbol Group Centered (scaled 0.45x, offset to 85, 24) -->
    <g transform="translate(85, 24) scale(0.4492)">
        <!-- Ambient Glow -->
        <g opacity="0.25" filter="url(#stackedGlow)">
            <path d="M 376 116 L 180 116 L 124 172 L 124 340 L 180 396 L 376 396 L 396 364 L 196 364 L 164 332 L 164 180 L 196 148 L 396 148 Z" fill="url(#stackedGrad)"/>
            <path d="M 164 228 L 328 228 L 360 256 L 328 284 L 164 284 Z" fill="url(#stackedGrad)"/>
        </g>
        <!-- Outer Orbital Crest Ribbon -->
        <path d="M 376 116 L 180 116 L 124 172 L 124 340 L 180 396 L 376 396 L 400 360 L 204 360 L 168 324 L 168 188 L 204 152 L 400 152 Z" fill="url(#stackedGrad)"/>
        <!-- Central Keyway Core Tongue -->
        <g>
            <path d="M 164 232 L 324 232 L 356 256 L 324 280 L 164 280 Z" fill="url(#stackedGrad)"/>
            <path d="M 270 248 C 265 248 261 251.5 261 256 C 261 258.8 262.5 261.2 264.8 262.6 L 263 268 L 277 268 L 275.2 262.6 C 277.5 261.2 279 258.8 279 256 C 279 251.5 275 248 270 248 Z" fill="#080A14"/>
        </g>
        <!-- Interlocking Orbital Protective Ribbon -->
        <path d="M 400 180 L 364 216 L 364 296 L 400 332 L 420 304 L 396 280 L 396 232 L 420 208 Z" fill="url(#cyanAccentStacked)"/>
    </g>

    <!-- Centered Wordmark & Subtitle -->
    <text x="200" y="300" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Roboto', sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="9" 
          fill="#F4F6FF">ELVARIX</text>
    
    <text x="200" y="336" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', 'Roboto', sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#43E7D0">ZERO-KNOWLEDGE CIPHER VAULT</text>
</svg>
