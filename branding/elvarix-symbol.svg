<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <!-- Luminous Core Gradient: Violet to Electric Cyan -->
        <linearGradient id="elvarixGrad" x1="120" y1="110" x2="420" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="55%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#43E7D0"/>
        </linearGradient>

        <!-- Cyan Accent Gradient -->
        <linearGradient id="cyanAccent" x1="260" y1="180" x2="420" y2="340" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#43E7D0"/>
        </linearGradient>

        <!-- Ambient Glow -->
        <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="16" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Deep Ambient Glow Layer -->
    <g opacity="0.28" filter="url(#coreGlow)">
        <!-- Outer Orbital Spine & Flanges forming 'E' -->
        <path d="M 376 116 L 180 116 L 124 172 L 124 340 L 180 396 L 376 396 L 396 364 L 196 364 L 164 332 L 164 180 L 196 148 L 396 148 Z" fill="url(#elvarixGrad)"/>
        <!-- Central Keyway Core Tongue -->
        <path d="M 164 228 L 328 228 L 360 256 L 328 284 L 164 284 Z" fill="url(#elvarixGrad)"/>
    </g>

    <!-- Primary Geometric 'E' Outer Orbital Ribbon -->
    <path d="M 376 116 L 180 116 L 124 172 L 124 340 L 180 396 L 376 396 L 400 360 L 204 360 L 168 324 L 168 188 L 204 152 L 400 152 Z" 
          fill="url(#elvarixGrad)"/>

    <!-- Precision Chamfer Top-Right Cap -->
    <polygon points="376,116 400,152 384,152 360,116" fill="#A5B0CC" opacity="0.3"/>

    <!-- Central Cryptographic Core Tongue (Negative Space Keyway) -->
    <g>
        <path d="M 164 232 L 324 232 L 356 256 L 324 280 L 164 280 Z" fill="url(#elvarixGrad)"/>
        <!-- Precision Chamfer Highlight on Core Head -->
        <polygon points="324,232 356,256 344,256 312,232" fill="#F4F6FF" opacity="0.45"/>
        
        <!-- Negative Space Keyway Slot Aperture -->
        <path d="M 270 248 C 265 248 261 251.5 261 256 C 261 258.8 262.5 261.2 264.8 262.6 L 263 268 L 277 268 L 275.2 262.6 C 277.5 261.2 279 258.8 279 256 C 279 251.5 275 248 270 248 Z" 
              fill="#080A14"/>
    </g>

    <!-- Interlocking Orbital Protective Ribbon (Electric Cyan Accent) -->
    <path d="M 400 180 L 364 216 L 364 296 L 400 332 L 420 304 L 396 280 L 396 232 L 420 208 Z" 
          fill="url(#cyanAccent)"/>
</svg>
