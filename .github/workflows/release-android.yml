name: Build and Release Elvarix Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set Release Version Environment
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.version_tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          # Ensure leading v is present for version tag
          if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
            RELEASE_TAG="v$RELEASE_TAG"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "Determined release tag: ${RELEASE_TAG}"

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests
        run: |
          echo "Running unit test suite (CryptoEngine, PasswordGen, TOTP, RecoveryKey)..."
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Release Signing Secrets
        id: check-secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not configured!"
            MISSING=1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is not configured!"
            MISSING=1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS is not configured!"
            MISSING=1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD is not configured!"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "=========================================================================="
            echo "❌ ERROR: Production Android release signing secrets are missing!"
            echo "=========================================================================="
            echo "Configure the following repository secrets under Settings > Secrets & Variables > Actions:"
            echo "  1. ANDROID_KEYSTORE_BASE64"
            echo "  2. ANDROID_KEYSTORE_PASSWORD"
            echo "  3. ANDROID_KEY_ALIAS"
            echo "  4. ANDROID_KEY_PASSWORD"
            echo ""
            echo "Per security specifications, Elvarix will NEVER publish unsigned or debug APKs."
            echo "=========================================================================="
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/nova_vault_release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty or corrupted!"
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Compiling signed production release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signed APK Integrity
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found at $RELEASE_APK"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$RELEASE_APK")
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::Release APK is abnormally small ($FILE_SIZE bytes)!"
            exit 1
          fi
          echo "Release APK built successfully: $RELEASE_APK ($FILE_SIZE bytes)"

          # Locate apksigner from Android SDK build tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature using $APKSIGNER..."
            $APKSIGNER verify --verbose "$RELEASE_APK"
            echo "Signature verification passed!"
          else
            echo "apksigner tool not found; skipping apksigner check."
          fi

      - name: Package Release Assets & Compute Checksum
        run: |
          mkdir -p release-artifacts
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          # 1. Primary branded release asset
          cp "$RELEASE_APK" "release-artifacts/Elvarix.apk"
          cp "$RELEASE_APK" "release-artifacts/Elvarix-${{ env.RELEASE_TAG }}.apk"

          # 2. Backward compatibility alias for legacy installations
          cp "$RELEASE_APK" "release-artifacts/NovaVault.apk"
          cp "$RELEASE_APK" "release-artifacts/NovaVault-${{ env.RELEASE_TAG }}.apk"

          # 3. Compute SHA-256 Checksums
          cd release-artifacts
          sha256sum Elvarix.apk > Elvarix.apk.sha256
          sha256sum NovaVault.apk > NovaVault.apk.sha256
          cat Elvarix.apk.sha256

          # 4. Generate latest.json manifest for in-app automatic updates
          VERSION_CLEAN=$(echo "${{ env.RELEASE_TAG }}" | sed 's/^v//')
          SHA_VAL=$(awk '{print $1}' Elvarix.apk.sha256)
          cat <<EOF > latest.json
          {
            "versionCode": 2,
            "versionName": "$VERSION_CLEAN",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/Elvarix.apk",
            "sha256": "$SHA_VAL",
            "releaseNotes": "Elvarix $RELEASE_TAG: Rebrand to Elvarix, authoritative email verification, enhanced Home dashboard with active creation FAB, and secure in-app update system.",
            "mandatory": false,
            "minVersionCode": 1
          }
          EOF
          cat latest.json
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Elvarix ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/Elvarix.apk
            release-artifacts/Elvarix-${{ env.RELEASE_TAG }}.apk
            release-artifacts/Elvarix.apk.sha256
            release-artifacts/NovaVault.apk
            release-artifacts/NovaVault-${{ env.RELEASE_TAG }}.apk
            release-artifacts/NovaVault.apk.sha256
            release-artifacts/latest.json
          body: |
            ## Elvarix ${{ env.RELEASE_TAG }} — Official Android Release

            ### 🔐 Cryptographic Integrity & Downloads
            - **Direct Stable Download:** [`Elvarix.apk`](https://github.com/${{ github.repository }}/releases/latest/download/Elvarix.apk)
            - **Versioned Download:** `Elvarix-${{ env.RELEASE_TAG }}.apk`
            - **SHA-256 Checksum:** `Elvarix.apk.sha256`
            - **Auto-Update Manifest:** [`latest.json`](https://github.com/${{ github.repository }}/releases/latest/download/latest.json)
            - **Backward-Compatible Alias:** `NovaVault.apk`

            #### Verify SHA-256 Before Installing:
            ```bash
            # Linux / macOS
            sha256sum -c Elvarix.apk.sha256

            # Windows PowerShell
            Get-FileHash Elvarix.apk -Algorithm SHA256
            ```

            ---

            ### 🚀 Highlights
            - **Rebranded to Elvarix:** Sovereign, futuristic security identity with native Jetpack Compose aurora backdrop.
            - **Strict Backward Compatibility:** Same Android `applicationId` (`com.novavault`) and production release signature, enabling seamless upgrade over earlier versions.
            - **In-App Auto Updates:** Manifest discovery (`latest.json`), progress indicator, SHA-256 verification, and PackageInstaller handoff.
            - **Authoritative Email Verification:** Enforced backend verification check with 60-second cooldown and masked email display.
            - **Home Dashboard Plus Button:** Prominent floating action button wired directly to the shared item creation workflow.
            - **Envelope Encryption:** AES-256-GCM + Argon2id (64 MiB, 3 iterations, 4 lanes).
            - **Hardware Keystore & Biometrics:** Device-specific key wrapping with Class 3 `BiometricPrompt`.
            - **Android System Autofill:** Native `AutofillService` integration with `AssistStructure` heuristics.
            - **Built-in RFC 6238 TOTP:** Two-factor authenticator with CameraX QR scanner and 30s wheel.
            - **Offline Recovery Kit:** 32-byte offline recovery code for emergency master key restoration.

      - name: Securely Clean Up Keystore
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_PATH }}" ] && [ -f "${{ env.KEYSTORE_PATH }}" ]; then
            echo "Zeroing and deleting temporary keystore..."
            shred -u "${{ env.KEYSTORE_PATH }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_PATH }}"
          fi
