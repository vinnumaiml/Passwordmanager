# Netlify Configuration for NOVA VAULT
# Tells Netlify to serve the static site directly from the website/ directory

[build]
  publish = "website"

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
